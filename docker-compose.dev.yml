# =============================================================================
#  Celebrity Quiz — Development override
#  Usage: make dev   (or docker compose -f docker-compose.yml -f docker-compose.dev.yml up)
#
#  Features:
#    - Next.js dev server with hot-reload on port 3001
#    - Source files mounted from host → changes reflect instantly
#    - PostgreSQL on port 5432
# =============================================================================

name: celebrity-quiz

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev             # use the lightweight dev stage
    image: ${IMAGE_NAME:-celebrity-quiz}:dev
    container_name: celebrity-quiz-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-celebrity_quiz}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-change-me}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - TZ=${TZ:-Europe/Paris}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-false}
    volumes:
      - .:/app
      - /app/node_modules
      - nextjs-cache:/app/.next
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  nextjs-cache:
    name: celebrity-quiz-nextjs-cache
