# =============================================================================
#  nginx configuration — Docker container (HTTP only)
#  SSL/TLS is handled upstream by a reverse proxy (Traefik, Caddy, etc.)
# =============================================================================

# Tune worker processes to available CPUs
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ── MIME types ──────────────────────────────────────────────────────────
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;   # hide nginx version

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ── Server ───────────────────────────────────────────────────────────────
    server {
        listen       80;
        listen  [::]:80;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options            "DENY"                          always;
        add_header X-Content-Type-Options     "nosniff"                       always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-inline'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data: https://picsum.photos https://images.unsplash.com; \
             connect-src 'self'; \
             font-src 'self'; \
             frame-ancestors 'none';"          always;

        # ── Cache control ─────────────────────────────────────────────────
        # HTML pages: never cache (always up to date)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Frame-Options            "DENY"            always;
            add_header X-Content-Type-Options     "nosniff"         always;
        }

        # Hashed JS/CSS bundles: cache forever (content hash in filename)
        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Other static assets (images, fonts, public/)
        location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf)$ {
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        # ── robots.txt / sitemap ─────────────────────────────────────────
        location = /robots.txt  { access_log off; log_not_found off; }
        location = /sitemap.xml { access_log off; }

        # ── SPA fallback (Next.js static export with trailingSlash) ──────
        location / {
            try_files $uri $uri/ $uri.html $uri/index.html =404;
        }

        # ── Custom error pages ────────────────────────────────────────────
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
